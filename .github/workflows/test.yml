name: Run tests

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-rust-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust_version: ["1.94", "1.97"]
    steps:
      - name: rustup toolchain install ${{ matrix.rust_version }}
        run: |
          rustup toolchain install ${{ matrix.rust_version }}

      - uses: actions/checkout@v4

      - run: rustup override set ${{ matrix.rust_version }}

      - run: rustup component add rustfmt clippy

      - name: cargo check
        run: cargo check

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy check
        run: cargo clippy --all-targets

  check-each-crate:
    # A workspace build merges the features every crate asks for, so a crate
    # that uses a feature without declaring it still compiles there and
    # fails as soon as it is built alone (`cargo test -p librqbit-upnp`).
    # The desktop app is left out: it needs the Tauri system libraries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-each-crate

      - name: cargo check each crate alone, with its tests and examples
        run: |
          for package in $(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[].name | select(. != "rqbit-desktop")'); do
            echo "::group::$package"
            cargo check --package "$package" --all-targets
            echo "::endgroup::"
          done

  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1

      - name: Run tests
        if: ${{ matrix.os == 'windows-latest' }}
        run: cargo test --workspace

      - name: Run tests
        if: ${{ matrix.os == 'macos-latest' }}
        run: ulimit -n unlimited && cargo test --workspace

      - name: Run tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: cargo test
